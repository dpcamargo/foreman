                      - text: O FBI alertou que os ataques FortiBleed continuam activos, comprometendo firewalls e gateways SSL VPN da Fortinet. Os atacantes acedem com credenciais roubadas, logs de infostealers e ataques de credential stuffing, extraem hashes de passwords e partem-nos offline com um cluster de GPUs a correr Hashcat e Hashtopolis. Em vários incidentes, criaram contas de administrador e apagaram as existentes, bloqueando os administradores legítimos.O SOCRadar contabiliza 86 644 dispositivos comprometidos em 194 países. A cadeia de ataque tem sido ponto de entrada para grupos de ransomware como o INC/Lynx e o Payload ransomware.
